/* ============================== STATE MODEL ============================== */
const newDay = date => ({
  date, recovery: false, gymMode: 'workout', tasks: {}, missions: {}, protein: 0,
  earlyBird: false, early: 0, overdrive: 0, overdriveText: '', timers: {},
  c70: false, c90: false, logged: false, journal: '', ntfy: null, lastPing: 0,
});
const defaults = () => ({
  v: 1,
  settings: {
    proteinTarget: 150, activeStart: 9, activeEnd: 21, notif: false, notifEvery: 60,
    ntfyTopic: '', sound: true, haptics: true,
    rewards: [{ id: uid(), pts: 500, label: 'Takeaway Night' }, { id: uid(), pts: 600, label: 'Wishlist Item' }],
  },
  focus: Object.fromEntries(CATS.map(c => [c.id, c.defFocus])),
  levelAck: {},
  vault: seedVault(),
  today: newDay(dateStr()),
  history: {},
});

function scoreDay(day) {
  const cats = Object.fromEntries(CATS.map(c => [c.id, 0]));
  let base = 0;
  if (day.recovery) RECOVERY.forEach(t => { base += t.pts * (day.tasks[t.id] || 0); });
  else TASKS.forEach(t => { const p = t.pts * (day.tasks[t.id] || 0); cats[t.cat] += p; base += p; });
  base = Math.min(100, base);
  let bonus = 0;
  if (!day.recovery) {
    if (day.earlyBird && (day.early || 0) >= 25) bonus += 5;
    if (base >= 85) bonus += 10 * (day.overdrive || 0);
  }
  bonus = Math.min(15, bonus);
  return { base, bonus, total: base + bonus, cats };
}
function snapshot(day, focus) {
  const sc = scoreDay(day);
  return { date: day.date, score: sc.total, base: sc.base, bonus: sc.bonus, cats: sc.cats,
    recovery: !!day.recovery, journal: day.journal || '', focus: { ...focus }, logged: !!day.logged };
}
function rollover(n) {
  const t = dateStr();
  if (n.today.date === t) return false;
  if (n.today.date < t) n.history[n.today.date] = snapshot(n.today, n.focus);
  n.today = newDay(t);
  return true;
}
function hydrate(raw) {
  const d = defaults();
  if (!raw || typeof raw !== 'object') return d;
  const n = { ...d, ...raw };
  n.settings = { ...d.settings, ...(raw.settings || {}) };
  if (!Array.isArray(n.settings.rewards)) n.settings.rewards = d.settings.rewards;
  n.focus = { ...d.focus, ...(raw.focus || {}) };
  n.vault = { ...d.vault, ...(raw.vault || {}) };
  CATS.forEach(c => { if (!Array.isArray(n.vault[c.id])) n.vault[c.id] = d.vault[c.id]; });
  n.today = { ...newDay(dateStr()), ...(raw.today || {}) };
  ['tasks', 'missions', 'timers'].forEach(k => { if (!n.today[k] || typeof n.today[k] !== 'object') n.today[k] = {}; });
  n.history = raw.history && typeof raw.history === 'object' ? raw.history : {};
  n.levelAck = raw.levelAck && typeof raw.levelAck === 'object' ? raw.levelAck : {};
  rollover(n);
  return n;
}
function load() {
  try { return hydrate(JSON.parse(localStorage.getItem(STORE_KEY))); } catch (e) { return defaults(); }
}

/* Streak, shields and gold days are replayed from history, so they can never drift out of sync. */
function replay(history, upto) {
  const dates = Object.keys(history).sort();
  let streak = 0, best = 0, shields = 0, gold = 0, golds = 0, shieldsUsed = 0;
  if (!dates.length) return { streak, best, shields, gold, golds, shieldsUsed };
  let d = dates[0], guard = 0;
  while (d < upto && guard++ < 5000) {
    const h = history[d]; const sc = h ? h.score : 0;
    if (sc >= 70) streak++;
    else if (streak > 0 && shields > 0) { shields--; shieldsUsed++; }
    else streak = 0;
    if (sc >= 90) { golds++; gold++; if (gold >= 3) { gold = 0; shields = Math.min(2, shields + 1); } }
    best = Math.max(best, streak);
    d = addDays(d, 1);
  }
  return { streak, best, shields, gold, golds, shieldsUsed };
}
const focusCount = (history, cat, focus) =>
  Object.values(history).filter(h => h && !h.recovery && h.focus && h.focus[cat] === focus && h.cats && h.cats[cat] > 0).length;
function rustMap(history, today) {
  const first = Object.keys(history).sort()[0]; const out = {};
  CATS.forEach(c => {
    let n = 0, d = addDays(today, -1), guard = 0;
    while (first && n < 3 && d >= first && guard++ < 14) {
      const h = history[d];
      if (h && h.recovery) { d = addDays(d, -1); continue; }
      if (h && h.cats && h.cats[c.id] > 0) break;
      n++; d = addDays(d, -1);
    }
    out[c.id] = n >= 3;
  });
  return out;
}

  while (d < today) { if (history[d]) sum += history[d].score; d = addDays(d, 1); }

}

let actx = null;
function unlockAudio() {
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {}
}
function chime(kind) {
  try {
    unlockAudio(); if (!actx) return;
    const notes = kind === 'ping' ? [880, 1174.66] : [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.17;

      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.85);
    });
  } catch (e) {}
}
function fireConfetti(colors) {
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const c = document.createElement('canvas'), W = c.width = innerWidth, H = c.height = innerHeight;
    c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100';
    document.body.appendChild(c);
    const x = c.getContext('2d');
    const ps = Array.from({ length: 130 }, () => ({
      x: W / 2, y: H * 0.3, vx: (Math.random() - 0.5) * 16, vy: Math.random() * -14 - 3,
      s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, col: colors[Math.floor(Math.random() * colors.length)],
    }));
    const t0 = performance.now();
    (function frame(now) {
      const el = now - t0; x.clearRect(0, 0, W, H);
      ps.forEach(p => {
        p.vy += 0.38; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
        x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = clamp(1 - (el - 1500) / 900, 0, 1);
        x.fillStyle = p.col; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore();
      });
      if (el < 2400) requestAnimationFrame(frame); else c.remove();
    })(t0);
  } catch (e) {}
}

const buildPrompt = (cat, focus) => `I use a habit app with an "Idea Vault" for my ${cat.name} category. My current focus is: "${focus}".

Give me exactly 15 fresh, concrete task ideas for this focus:
- 5 with energy "low" (low energy, doable from the couch)
- 5 with energy "quick" (about 15 minutes)
- 5 with energy "deep" (a deep dive needing 30+ minutes of real effort)

Reply with ONLY a JSON array and no commentary, in exactly this shape:
[{"text":"...","energy":"low"},{"text":"...","energy":"quick"},{"text":"...","energy":"deep"}]

Each "text" must be one specific action under 90 characters that I can start immediately.`;
function parseIdeas(str) {
  const a = str.indexOf('['), b = str.lastIndexOf(']');
  if (a < 0 || b <= a) throw new Error('No JSON array found. Paste the whole reply, starting with [ and ending with ].');
  let arr;
  try { arr = JSON.parse(str.slice(a, b + 1)); } catch (e) { throw new Error('That JSON has a typo in it. Ask Claude to resend only the JSON array.'); }
  const out = (Array.isArray(arr) ? arr : []).map(it => {
    const text = typeof it === 'string' ? it : (it && (it.text || it.task || it.idea || it.title)) || '';
    const e = String((it && it.energy) || '').toLowerCase();
    const energy = /low|couch/.test(e) ? 'low' : /deep/.test(e) ? 'deep' : 'quick';
    return { id: uid(), text: String(text).trim(), energy };
  }).filter(i => i.text);
  if (!out.length) throw new Error('The array was empty or had no "text" fields.');
  return out;
}

function Ring({ total, color }) {
  const r = 30, c = 2 * Math.PI * r, r2 = 36, c2 = 2 * Math.PI * r2;
  const pct = clamp(total / 100, 0, 1), over = clamp((total - 100) / 15, 0, 1);
  const ease = { transition: 'stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .5s' };
  return (
    <div className="relative w-[78px] h-[78px] shrink-0" role="img" aria-label={`Today's score: ${fmt(total)} points`}>
      <svg width="78" height="78" viewBox="0 0 78 78">
        <circle cx="39" cy="39" r={r} stroke="#27272a" strokeWidth="6" fill="none" />
        <circle cx="39" cy="39" r={r} stroke={color} strokeWidth="6" fill="none" strokeLinecap="round" strokeDasharray={c} strokeDashoffset={c * (1 - pct)} transform="rotate(-90 39 39)" style={ease} />
        <circle cx="39" cy="39" r={r2} stroke="#fff" strokeWidth="2" fill="none" strokeLinecap="round" strokeDasharray={c2} strokeDashoffset={c2 * (1 - over)} transform="rotate(-90 39 39)" style={{ ...ease, opacity: over > 0 ? 0.9 : 0 }} />
      </svg>
      <div className="absolute inset-0 grid place-items-center">
        <div className="text-center leading-none">
          <div className="num text-[22px] font-bold" style={{ color }}>{fmt(total)}</div>
          <div className="num text-[9px] text-zinc-500 mt-1">/ 100</div>
        </div>
      </div>
    </div>
  );
}

function TimerBar({ t, onChange, accent, note }) {
  const [, force] = useState(0);
  const running = !!(t && t.end);
  useEffect(() => { if (!running) return; const i = setInterval(() => force(x => x + 1), 500); return () => clearInterval(i); }, [running]);
  const left = running ? Math.max(0, Math.round((t.end - Date.now()) / 1000)) : (t && t.left != null ? t.left : TIMER_SECS);
  const done = !!(t && t.done);
  return (
    <div className="mt-3 flex items-center gap-3 rounded-xl bg-zinc-950 border border-zinc-800 px-3 py-2">
      <Icon name="Timer" size={16} className="text-zinc-500" />
      <div className="num text-lg font-semibold w-16" style={{ color: running || done ? accent : '#e4e4e7' }} aria-live="off">{done ? 'Done' : `${pad(Math.floor(left / 60))}:${pad(left % 60)}`}</div>
      <div className="flex-1 text-[11px] text-zinc-500 leading-tight">{note}</div>
      {!done && <button onClick={() => { unlockAudio(); onChange(running ? { left } : { end: Date.now() + left * 1000 }); }} className="w-10 h-10 grid place-items-center rounded-lg bg-zinc-800 text-zinc-100" aria-label={running ? 'Pause timer' : 'Start timer'}><Icon name={running ? 'Pause' : 'Play'} size={16} /></button>}
      {(t && (done || !running)) && <button onClick={() => onChange(null)} className="w-10 h-10 grid place-items-center rounded-lg bg-zinc-800 text-zinc-400" aria-label="Reset timer"><Icon name="RotateCcw" size={16} /></button>}
    </div>
  );
}

}

        <div className="text-xs text-zinc-500 mt-2 leading-snug">Browsers pause web apps in the background, so these only fire while Daily OS is open. For pings that reach a locked phone, use ntfy below.</div>

        <div className="grid grid-cols-2 gap-3 mt-3">

        <button className={GHOST + ' w-full mt-3'} onClick={async () => toast((await copyText(JSON.stringify(s))) ? 'Backup copied to clipboard' : 'Could not copy')}><Icon name="Copy" size={18} />Copy backup as text</button>
        <label className="block text-xs text-zinc-400 mt-4 mb-1" htmlFor="paste">Or paste a backup</label>
        <textarea id="paste" className={INPUT + ' h-20 num text-xs'} value={paste} onChange={e => setPaste(e.target.value)} placeholder='{"v":1, ...}' />
        <button className={GHOST + ' w-full mt-2'} disabled={!paste.trim()} onClick={() => doImport(paste)}>Restore pasted backup</button>
      </div>

      <div className={CARD}>
        <h3 className="font-semibold text-zinc-50">Danger zone</h3>

      </div>
      <div className="text-center text-[11px] text-zinc-600 pb-2">100-Point Daily OS · data stays on this device</div>

  );
}

/* ============================== APP ============================== */
function App() {
  const [s, setS] = useState(load);
  const [tab, setTab] = useState('today');
  const [modal, setModal] = useState(null);
  const [toastMsg, setToastMsg] = useState('');
  const [busy, setBusy] = useState(false);
  const ref = useRef(s); ref.current = s;
  const toastTimer = useRef(null);

  const update = useCallback(fn => setS(p => {
    const n = JSON.parse(JSON.stringify(p)); fn(n);
    if (n.today.logged) n.history[n.today.date] = snapshot(n.today, n.focus);
    return n;
  }), []);
  const replaceAll = raw => setS(hydrate(raw));
  const toast = useCallback(msg => { setToastMsg(msg); clearTimeout(toastTimer.current); toastTimer.current = setTimeout(() => setToastMsg(''), 2600); }, []);

  const day = s.today, st = s.settings;
  const sc = scoreDay(day);
  const tier = tierFor(sc.total), accent = tier.color;
  const rp = replay(s.history, day.date);
  const displayStreak = rp.streak + (sc.total >= 70 ? 1 : 0);
  const rust = rustMap(s.history, day.date);
  const sound = () => { if (ref.current.settings.sound) chime(); };
  const buzz = () => { try { if (st.haptics && navigator.vibrate) navigator.vibrate(40); } catch (e) {} };

  /* persistence */
  useEffect(() => { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {} }, [s]);
  useEffect(() => { document.title = `${fmt(sc.total)}/100 · Daily OS`; document.documentElement.style.setProperty('--accent', accent); }, [sc.total, accent]);
  useEffect(() => { const h = () => unlockAudio(); window.addEventListener('pointerdown', h, { once: true }); return () => window.removeEventListener('pointerdown', h); }, []);

  /* pacing */
  const pace = () => {
    const now = new Date(), h = now.getHours() + now.getMinutes() / 60, cur = scoreDay(ref.current.today).total;
    const a = ref.current.settings.activeStart, b = ref.current.settings.activeEnd;
    if (b <= a || h < a) return { active: false, text: 'Pacing starts when your active hours begin.' };
    const expected = Math.round(70 * clamp((h - a) / (b - a), 0, 1));
    const active = h < b;
    if (cur >= 70) return { active, text: 'Streak is safe for today.' };
    return { active, text: cur >= expected ? `On pace — ${fmt(70 - cur)} more points makes the streak safe.` : `${fmt(expected - cur)} points behind pace for 70 by ${pad(b)}:00.` };
  };
  const nextOpen = d => (d.recovery ? RECOVERY : TASKS).find(t => (d.tasks[t.id] || 0) < 1);

  /* ntfy */
  const ntfyUrl = topic => `https://ntfy.sh/${encodeURIComponent(topic)}`;
  const sendTestPing = async () => {
    try { const r = await fetch(ntfyUrl(st.ntfyTopic), { method: 'POST', body: 'Test ping from 100-Point Daily OS. If you can read this, phone pings work.', headers: { Title: 'Daily OS test', Tags: 'white_check_mark' } }); toast(r.ok ? 'Test sent — check your phone' : `ntfy said no (${r.status})`); }
    catch (e) { toast('Could not reach ntfy.sh — check your connection'); }
  };
  const cancelPings = async (info, announce) => {
    const pending = (info.items || []).filter(i => i.at > Date.now());
    await Promise.all(pending.map(i => fetch(`${ntfyUrl(info.topic)}/${encodeURIComponent(i.seq)}`, { method: 'DELETE' }).catch(() => null)));
    if (announce) { try { await fetch(ntfyUrl(info.topic), { method: 'POST', body: `You hit ${fmt(scoreDay(ref.current.today).total)} points. The rest of today's pings are cancelled.`, headers: { Title: 'Daily OS: target reached', Tags: 'tada', Priority: 'low' } }); } catch (e) {} }
  };
  const queuePings = async () => {
    const topic = st.ntfyTopic.trim();
    if (!topic) { setTab('settings'); toast('Add your ntfy topic in Settings first'); return; }
    if (sc.total >= 75) { toast('Already at 75+ — no pings needed today'); return; }
    const now = new Date(), times = [];
    for (let h = Math.max(st.activeStart, now.getHours() + 1); h <= st.activeEnd; h++) { const at = new Date(); at.setHours(h, 0, 0, 0); if (at - now > 60000) times.push(at); }
    if (!times.length) { toast('No active hours left today'); return; }
    setBusy(true);
    try {
      if (day.ntfy && !day.ntfy.cancelled) await cancelPings(day.ntfy, false);
      const items = await Promise.all(times.map(async at => {
        const seq = `dos-${day.date}-${at.getHours()}-${uid()}`;
        const r = await fetch(ntfyUrl(topic), { method: 'POST',
          body: `${pad(at.getHours())}:00 check-in. Still under 75? Open Daily OS and bank your next task to keep the streak.`,
          headers: { Title: '100-Point Daily OS', At: String(Math.floor(at.getTime() / 1000)), Tags: 'dart', 'X-Sequence-ID': seq } });
        if (!r.ok) throw new Error(String(r.status));
        const j = await r.json().catch(() => ({}));
        return { at: at.getTime(), seq: j.sequence_id || j.id || seq };
      }));
      update(n => { n.today.ntfy = { topic, items, cancelled: false }; });
      toast(`${items.length} phone pings queued`);
    } catch (e) { toast(e.message === '429' ? 'ntfy rate limit hit — try again later' : 'Could not queue pings — check topic and connection'); }
    setBusy(false);
  };

  /* score watchers: confetti, early-bird tracking, ntfy auto-cancel */
  useEffect(() => {
    if (sc.total >= 70 && !day.c70) { fireConfetti([accent, '#ffffff', '#d4d4d8', '#7dd3fc']); sound(); update(n => { n.today.c70 = true; }); }
    if (sc.total >= 90 && !day.c90) { fireConfetti(['#facc15', '#ffffff', '#fde68a', '#f59e0b']); sound(); update(n => { n.today.c90 = true; }); }
    if (!day.recovery && new Date().getHours() < 11 && sc.base > (day.early || 0)) update(n => { n.today.early = sc.base; });
    if (sc.total >= 75 && day.ntfy && !day.ntfy.cancelled) { const info = day.ntfy; update(n => { if (n.today.ntfy) n.today.ntfy.cancelled = true; }); cancelPings(info, true).then(() => toast('75+ reached — phone pings cancelled')); }
  }, [sc.total, sc.base]);

  /* heartbeat: timers, midnight rollover, local nudges */
  useEffect(() => {
    const tick = () => {
      const cur = ref.current, now = Date.now();
      if (cur.today.date !== dateStr()) { setS(p => { const n = JSON.parse(JSON.stringify(p)); rollover(n); return n; }); return; }
      const due = Object.keys(cur.today.timers || {}).filter(id => cur.today.timers[id] && cur.today.timers[id].end && now >= cur.today.timers[id].end);
      if (due.length) {
        update(n => due.forEach(id => { n.today.timers[id] = { left: 0, done: true }; const t = TASKS.find(x => x.id === id); if (t && t.auto && !n.today.recovery) n.today.tasks[id] = 1; }));
        if (cur.settings.sound) chime();
        try { if (cur.settings.haptics && navigator.vibrate) navigator.vibrate([80, 60, 80]); } catch (e) {}
        toast(due.includes('learn') ? '30 minutes done — Learning points awarded' : 'Focus block complete — tick it off');
      }
      const total = scoreDay(cur.today).total, h = new Date().getHours();
      if (cur.settings.notif && total < 70 && h >= cur.settings.activeStart && h < cur.settings.activeEnd && now - (cur.today.lastPing || 0) >= cur.settings.notifEvery * 60000) {
        const nx = nextOpen(cur.today), body = `${pace().text}${nx ? ' Next up: ' + nx.label : ''}`;
        try { if ('Notification' in window && Notification.permission === 'granted') new Notification(`Daily OS: ${fmt(total)}/100`, { body, tag: 'daily-os-pace' }); } catch (e) {}
        if (cur.settings.sound) chime('ping');
        toast(body);
        update(n => { n.today.lastPing = now; });
      }
    };
    const i = setInterval(tick, 1000);
    const vis = () => { if (!document.hidden) tick(); };
    document.addEventListener('visibilitychange', vis);
    return () => { clearInterval(i); document.removeEventListener('visibilitychange', vis); };
  }, []);

  /* actions */
  const setTask = (id, v) => { if (v > 0) buzz(); update(n => { n.today.tasks[id] = v; }); };
  const setTimer = (id, t) => update(n => { if (t) n.today.timers[id] = t; else delete n.today.timers[id]; });
  const addProtein = g => { buzz(); update(n => { n.today.protein = clamp((n.today.protein || 0) + g, 0, 999); if (n.today.protein >= n.settings.proteinTarget && n.settings.proteinTarget > 0) n.today.tasks.protein = 1; }); };
  const getPick = (energy, time) => {
    const lvl = { low: 1, med: 2, high: 3 }[energy], d = ref.current.today;
    const meta = t => (t.id === 'gym' && d.gymMode === 'rest' ? { ...t, energy: 1, label: 'Active rest: steps + mobility' } : t);
    const open = (d.recovery ? RECOVERY : TASKS).map(meta).filter(t => (d.tasks[t.id] || 0) < 1);
    if (!open.length) return { task: null };
    const fit = open.filter(t => t.energy <= lvl && t.mins <= time);
    const pool = fit.length ? fit : open, task = pool[Math.floor(Math.random() * pool.length)];
    let idea = null;
    if (task.cat) {
      const want = energy === 'low' ? 'low' : energy === 'high' && time === 30 ? 'deep' : 'quick';
      const tag = task.id === 'gym' && d.gymMode === 'rest' ? 'rest' : undefined;
      const ideas = ref.current.vault[task.cat].filter(i => i.energy === want && i.tag === tag);
      if (ideas.length) idea = ideas[Math.floor(Math.random() * ideas.length)].text;
    }
    return { task, label: task.label, catName: task.cat ? CAT[task.cat].name : 'Recovery', idea, relaxed: !fit.length };
  };

  /* level-up check-ins */
  const levelUps = CATS.map(c => {
    const focus = s.focus[c.id], count = focusCount(s.history, c.id, focus), key = c.id + '|' + focus;
    return { cat: c, focus, count, key, due: Math.floor(count / LEVEL_EVERY) > (s.levelAck[key] || 0) };
  });
  const ack = lu => update(n => { n.levelAck[lu.key] = Math.floor(lu.count / LEVEL_EVERY); });

  /* ---------- Today tab pieces ---------- */
  const catCard = c => {
    const tasks = TASKS.filter(t => t.cat === c.id), earned = sc.cats[c.id];
    const rusty = rust[c.id] && earned === 0, mission = day.missions[c.id];
    return (
      <section key={c.id} id={'cat-' + c.id} className={CARD + (rusty ? ' !border-amber-500/70' : '')} aria-label={c.name}>
        <div className="flex items-center gap-3">
          <div className="w-10 h-10 rounded-xl grid place-items-center shrink-0" style={earned >= c.pts ? { background: accent, color: '#09090b' } : { background: '#27272a', color: '#d4d4d8' }}><Icon name={c.icon} /></div>
          <div className="flex-1 min-w-0">
            <h3 className="font-semibold text-zinc-50 leading-tight">{c.name}</h3>
            <div className="num text-xs text-zinc-400">{fmt(earned)} / {c.pts} pts</div>
          </div>
          <button aria-label={`Inspire me: ${c.name}`} className="w-11 h-11 grid place-items-center rounded-xl bg-zinc-800 text-zinc-200 active:scale-95 transition-transform" onClick={() => setModal({ type: 'idea', cat: c.id, tag: c.id === 'gym' && day.gymMode === 'rest' ? 'rest' : undefined })}><Icon name="Dices" /></button>
        </div>
        <div className="flex flex-wrap items-center gap-2 mt-3">
          <button className="inline-flex items-center gap-1.5 rounded-full border border-zinc-700 px-3 min-h-[32px] text-xs text-zinc-300 max-w-full" onClick={() => setModal({ type: 'sync', cat: c.id })} aria-label={`Edit current focus for ${c.name}: ${s.focus[c.id]}`}>
            <Icon name="Target" size={13} /><span className="truncate">{s.focus[c.id]}</span><Icon name="Pencil" size={11} className="text-zinc-500" />
          </button>
          {rusty && <span className="inline-flex items-center gap-1 rounded-full bg-amber-500/15 text-amber-400 px-2.5 min-h-[32px] text-xs font-semibold"><Icon name="TriangleAlert|AlertTriangle" size={13} />Rust Warning · 3 days at 0</span>}
        </div>
        {mission && (
          <div className="mt-3 flex items-start gap-2 rounded-xl bg-zinc-950 border border-zinc-800 px-3 py-2.5">
            <Icon name="Lock" size={14} className="mt-0.5" /><div className="flex-1 text-sm text-zinc-200 leading-snug"><span className="text-zinc-500">Today's mission: </span>{mission}</div>
            <button aria-label="Clear mission" className="text-zinc-500 w-7 h-7 -m-1 grid place-items-center" onClick={() => update(n => { delete n.today.missions[c.id]; })}><Icon name="X" size={14} /></button>
          </div>
        )}
        {c.id === 'gym' && (
          <div className="mt-3 grid grid-cols-2 gap-1 p-1 rounded-xl bg-zinc-950 border border-zinc-800" role="group" aria-label="Gym mode">
            {[['workout', 'Workout day'], ['rest', 'Active rest day']].map(([m, l]) => (
              <button key={m} aria-pressed={day.gymMode === m} className="rounded-lg min-h-[40px] text-sm font-medium text-zinc-400" style={day.gymMode === m ? { background: '#27272a', color: '#fafafa' } : {}} onClick={() => update(n => { n.today.gymMode = m; })}>{l}</button>
            ))}
          </div>
        )}
        <div className="mt-2">
          {tasks.map(t => {
            const val = day.tasks[t.id] || 0;
            const label = t.id === 'gym' ? (day.gymMode === 'rest' ? 'Scheduled Active Rest Day — steps + mobility hit' : 'Workout Attended') : t.label;
            return (
              <TaskRow key={t.id} label={label} pts={t.pts} val={val} accent={accent} onSet={v => setTask(t.id, v)}
                sub={t.id === 'protein' ? `${day.protein || 0}g of ${st.proteinTarget}g` : null}>
                {t.timer && <TimerBar t={day.timers[t.id]} accent={accent} onChange={x => setTimer(t.id, x)} note={t.auto ? 'Chimes and awards the points at 0:00' : '30-minute focus block'} />}
                {t.id === 'protein' && (
                  <div className="mt-3">
                    <div className="h-2 rounded-full bg-zinc-800 overflow-hidden"><div className="h-full rounded-full transition-all duration-500" style={{ width: `${clamp((day.protein || 0) / (st.proteinTarget || 1) * 100, 0, 100)}%`, background: accent }} /></div>
                    <div className="flex gap-2 mt-3">
                      <button aria-label="Remove 25 grams of protein" className={GHOST + ' !px-0 w-12'} onClick={() => addProtein(-25)}><Icon name="Minus" size={18} /></button>
                      <button className={GHOST + ' flex-1'} onClick={() => addProtein(25)}><Icon name="Plus" size={18} />25g Protein</button>
                      <button className={GHOST + ' flex-1'} onClick={() => setModal({ type: 'idea', cat: 'diet', tag: 'rescue' })}><Icon name="LifeBuoy" size={18} />Rescue Ideas</button>
                    </div>
                  </div>
                )}
              </TaskRow>
            );
          })}
        </div>
      </section>
    );
  };

  const earlyOK = (day.early || 0) >= 25, before11 = new Date().getHours() < 11, p = pace();
  const todayTab = (
    <div className="space-y-4">
      {levelUps.filter(l => l.due).map(lu => (
        <div key={lu.key} className="fade-in rounded-2xl p-4 border" style={{ borderColor: accent, background: 'rgba(255,255,255,.04)' }} role="status">
          <div className="flex items-center gap-2 font-semibold text-zinc-50"><Icon name="Trophy" />Level Up Check-In</div>
          <div className="text-sm text-zinc-300 mt-1 leading-snug">{lu.count} completions under “{lu.focus}” in {lu.cat.name}. Ready to raise the difficulty, or pivot to a new goal?</div>
          <div className="grid grid-cols-3 gap-2 mt-3">
            <button className={BTN + ' !px-2 text-xs'} style={{ background: accent, color: '#09090b' }} onClick={() => { ack(lu); setModal({ type: 'sync', cat: lu.cat.id }); }}>Harder</button>
            <button className={GHOST + ' !px-2 text-xs'} onClick={() => { ack(lu); setModal({ type: 'sync', cat: lu.cat.id }); }}>Pivot goal</button>
            <button className={GHOST + ' !px-2 text-xs'} onClick={() => ack(lu)}>Keep going</button>
          </div>
        </div>
      ))}

      {day.recovery ? (
        <section className={CARD} aria-label="Recovery Day">
          <div className="flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl grid place-items-center bg-zinc-800 text-zinc-200"><Icon name="HeartPulse" /></div>
            <div><h3 className="font-semibold text-zinc-50">Recovery Day</h3><div className="text-xs text-zinc-400">Rest counts. Hit 70 through self-care and the streak holds.</div></div>
          </div>
          <div className="mt-2">{RECOVERY.map(t => <TaskRow key={t.id} label={t.label} pts={t.pts} val={day.tasks[t.id] || 0} accent={accent} onSet={v => setTask(t.id, v)} />)}</div>
        </section>
      ) : (<>
        {CATS.map(catCard)}
        <section className={CARD} aria-label="Bonus points">
          <h3 className="font-semibold text-zinc-50">Bonus <span className="num text-xs text-zinc-400 font-normal">+{fmt(sc.bonus)} / 15</span></h3>
          <div className="flex items-center gap-3 py-3 mt-1">
            <Icon name="Sunrise" className="text-zinc-400" />
            <div className="flex-1"><div className="text-[15px] text-zinc-100">+5 Early Bird</div>
              <div className="text-xs text-zinc-400 mt-0.5">{earlyOK ? 'Unlocked: 25+ points logged before 11:00.' : before11 ? `${fmt(day.early || 0)} of 25 points logged before 11:00.` : 'Missed today — needs 25 points before 11:00.'}</div></div>
            <Toggle label="Claim Early Bird bonus" accent={accent} on={day.earlyBird && earlyOK} onChange={v => { if (!earlyOK) { toast('Log 25 points before 11:00 to unlock'); return; } buzz(); update(n => { n.today.earlyBird = v; }); }} />
          </div>
          {sc.base >= 85 ? (
            <div className="fade-in border-t border-zinc-800">
              <TaskRow label="+10 Overdrive Stretch Goal" pts={10} val={day.overdrive || 0} accent={accent} onSet={v => { if (v > 0) buzz(); update(n => { n.today.overdrive = v; }); }}>
                <input aria-label="Overdrive stretch goal" className={INPUT + ' mt-3'} value={day.overdriveText} onChange={e => update(n => { n.today.overdriveText = e.target.value; })} placeholder="Name your stretch goal for today" />
              </TaskRow>
            </div>
          ) : (
            <div className="flex items-center gap-3 py-3 border-t border-zinc-800 text-zinc-500"><Icon name="Lock" /><div className="text-sm">Hidden slot — unlocks at 85 points ({fmt(Math.max(0, 85 - sc.base))} to go)</div></div>
          )}
        </section>
      </>)}

      <section className={CARD} aria-label="Phone pings">
        <div className="flex items-start gap-3"><Icon name="Bell" className="text-zinc-400 mt-0.5" />
          <div className="flex-1"><div className="text-sm text-zinc-100">{p.text}</div>
            <div className="text-xs text-zinc-500 mt-1">{day.ntfy ? (day.ntfy.cancelled ? "Today's phone pings were cancelled at 75+." : `${day.ntfy.items.filter(i => i.at > Date.now()).length} phone pings still scheduled. They cancel themselves at 75+.`) : 'Hourly pushes to your phone until you reach 75.'}</div></div>
        </div>
        <button className={GHOST + ' w-full mt-3'} disabled={busy} onClick={queuePings}><Icon name="Send" size={18} />{busy ? 'Queueing…' : day.ntfy && !day.ntfy.cancelled ? "Re-queue Today's Phone Pings" : "Queue Today's Phone Pings"}</button>
      </section>

      <button className={BTN + ' w-full !min-h-[56px] text-base'} style={{ background: accent, color: '#09090b' }} onClick={() => setModal({ type: 'receipt' })}><Icon name="Receipt|ReceiptText" />{day.logged ? "View Today's Receipt" : 'Finish & Log Day'}</button>
      {day.logged && <div className="text-center text-xs text-zinc-500">Day logged. Changes you make before midnight still update it.</div>}
    </div>
  );

  const vaultTab = (
    <div className="space-y-4">
      <div className="text-sm text-zinc-400 leading-snug">Each category has a Current Focus and a deck of ideas. Change the focus, then use Goal Sync to have Claude write a fresh deck.</div>
      {CATS.map(c => <VaultCat key={c.id} cat={c} s={s} update={update} accent={accent} count={focusCount(s.history, c.id, s.focus[c.id])} openSync={() => setModal({ type: 'sync', cat: c.id })} />)}
    </div>
  );

  const NAV = [['today', 'Today', 'House|Home'], ['vault', 'Vault & Goals', 'Library'], ['stats', 'Analytics & Bank', 'ChartColumn|BarChart3|BarChart'], ['settings', 'Settings', 'Settings']];
  const mcat = modal && modal.cat ? CAT[modal.cat] : null;

  return (
    <div className="max-w-md mx-auto min-h-screen relative">
      <header className="sticky top-0 z-30 bg-zinc-950/90 backdrop-blur border-b border-zinc-800" style={{ paddingTop: 'env(safe-area-inset-top)' }}>
        <div className="flex items-center gap-3 px-4 py-3">
          <Ring total={sc.total} color={accent} />
          <div className="flex-1 min-w-0">
            <div className="text-[11px] uppercase tracking-widest text-zinc-500">{niceDate(day.date)}</div>
            <div className="text-lg font-bold leading-tight" style={{ color: accent }}>{day.recovery ? 'Recovery' : tier.name}<span className="text-zinc-400 font-normal text-sm"> · {tier.sub}</span></div>
            <div className="flex items-center gap-3 mt-1.5 text-zinc-300">
              <span className="inline-flex items-center gap-1 text-sm" title="Daily streak"><Icon name="Flame" size={16} /><span className="num font-semibold">{displayStreak}</span><span className="sr-only"> day streak</span></span>
              <span className="inline-flex items-center gap-0.5" role="img" aria-label={`${rp.shields} of 2 Streak Shields`}>
                {[0, 1].map(i => <span key={i} style={{ color: i < rp.shields ? accent : '#3f3f46' }}><Icon name="Shield" size={16} /></span>)}
              </span>
              {sc.bonus > 0 && <span className="num text-xs text-zinc-400">+{fmt(sc.bonus)} bonus</span>}
            </div>
          </div>
          <button aria-pressed={day.recovery} aria-label="Recovery Day mode" onClick={() => { buzz(); update(n => { n.today.recovery = !n.today.recovery; }); toast(day.recovery ? 'Back to a normal day' : 'Recovery Day on — rest is the task today'); }}
            className="flex flex-col items-center justify-center gap-0.5 w-16 h-14 rounded-xl border text-[10px] font-semibold shrink-0"
            style={day.recovery ? { background: accent, color: '#09090b', borderColor: accent } : { borderColor: '#3f3f46', color: '#a1a1aa' }}>
            <Icon name="HeartPulse" size={18} />Recovery
          </button>
        </div>
      </header>

      <main className="px-4 pt-4" style={{ paddingBottom: 'calc(11rem + env(safe-area-inset-bottom))' }}>
        <h1 className="sr-only">100-Point Daily OS</h1>
        <div key={tab} className="fade-in">
          {tab === 'today' && todayTab}
          {tab === 'vault' && vaultTab}
          {tab === 'stats' && <StatsTab s={s} update={update} accent={accent} rp={rp} sc={sc} displayStreak={displayStreak} />}
          {tab === 'settings' && <SettingsTab s={s} update={update} accent={accent} replaceAll={replaceAll} toast={toast} sendTestPing={sendTestPing} />}
        </div>
      </main>

      {tab === 'today' && (
        <button aria-label="What should I do now? Pick a task for me" onClick={() => setModal({ type: 'roulette' })}
          className="fixed z-40 w-14 h-14 rounded-full grid place-items-center shadow-xl shadow-black/60 active:scale-95 transition-transform"
          style={{ background: accent, color: '#09090b', right: 'max(1rem, calc(50vw - 14rem + 1rem))', bottom: 'calc(5.5rem + env(safe-area-inset-bottom))' }}><Icon name="Shuffle" size={24} /></button>
      )}

      <nav aria-label="Main" className="fixed bottom-0 inset-x-0 z-40 bg-zinc-950/95 backdrop-blur border-t border-zinc-800" style={{ paddingBottom: 'env(safe-area-inset-bottom)' }}>
        <div className="max-w-md mx-auto grid grid-cols-4">
          {NAV.map(([id, label, icon]) => (
            <button key={id} aria-current={tab === id ? 'page' : undefined} onClick={() => { setTab(id); window.scrollTo(0, 0); }} className="flex flex-col items-center justify-center gap-1 min-h-[64px] text-[10px] font-medium leading-tight px-1" style={{ color: tab === id ? accent : '#71717a' }}>
              <Icon name={icon} size={22} /><span>{label}</span>
            </button>
          ))}
        </div>
      </nav>

      <div aria-live="polite" className="fixed inset-x-0 z-[60] flex justify-center pointer-events-none px-4" style={{ bottom: 'calc(5.5rem + env(safe-area-inset-bottom))' }}>
        {toastMsg && <div className="fade-in max-w-sm rounded-xl bg-zinc-100 text-zinc-900 text-sm font-medium px-4 py-3 shadow-xl">{toastMsg}</div>}
      </div>

      {modal && modal.type === 'idea' && (
        <IdeaModal cat={mcat} accent={accent} showList={modal.tag === 'rescue'}
          tagLabel={modal.tag === 'rescue' ? 'Protein Rescue Ideas' : modal.tag === 'rest' ? 'Active Rest Ideas' : null}
          pool={s.vault[modal.cat].filter(i => (modal.tag ? i.tag === modal.tag : !i.tag))}
          onLock={text => { buzz(); update(n => { n.today.missions[modal.cat] = text; }); setModal(null); toast('Mission locked in'); }} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === 'sync' && (
        <GoalSyncModal cat={mcat} focus={s.focus[modal.cat]} accent={accent} toast={toast} count={focusCount(s.history, modal.cat, s.focus[modal.cat])}
          onSaveFocus={f => update(n => { n.focus[modal.cat] = f; })}
          onImport={(ideas, mode) => update(n => { n.vault[modal.cat] = mode === 'overwrite' ? [...n.vault[modal.cat].filter(i => i.tag), ...ideas] : [...n.vault[modal.cat], ...ideas]; })}
          onAdd={idea => update(n => { n.vault[modal.cat].push(idea); })} onClose={() => setModal(null)} />
      )}
      {modal && modal.type === 'roulette' && (
        <RouletteModal accent={accent} getPick={getPick} onClose={() => setModal(null)}
          onGo={res => { setModal(null); setTab('today'); setTimeout(() => { const el = res.task.cat && document.getElementById('cat-' + res.task.cat); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); else window.scrollTo({ top: 0, behavior: 'smooth' }); }, 60); }} />
      )}
      {modal && modal.type === 'receipt' && (
        <ReceiptModal day={day} focus={s.focus} sc={sc} tier={tier} streak={displayStreak} logged={day.logged} accent={accent} toast={toast} onClose={() => setModal(null)}
          onLog={journal => { buzz(); update(n => { n.today.journal = journal; n.today.logged = true; }); setModal(null); toast('Day logged — nice work'); }} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
/* Home-screen icon + web manifest, generated at runtime so the app stays a single file. */
(function () {
  try {
    var c = document.createElement('canvas'); c.width = c.height = 512; var x = c.getContext('2d');
    x.fillStyle = '#09090b'; x.fillRect(0, 0, 512, 512);
    x.lineWidth = 44; x.lineCap = 'round';
    x.strokeStyle = '#27272a'; x.beginPath(); x.arc(256, 256, 170, 0, Math.PI * 2); x.stroke();
    x.strokeStyle = '#facc15'; x.beginPath(); x.arc(256, 256, 170, -Math.PI / 2, Math.PI * 1.25); x.stroke();
    x.fillStyle = '#fafafa'; x.font = 'bold 150px ui-monospace, Menlo, monospace'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('100', 256, 266);
    var png = c.toDataURL('image/png');
    var add = function (rel, href) { var l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add('apple-touch-icon', png); add('icon', png);
    if (/^https?:/.test(location.protocol)) {
      var m = { name: '100-Point Daily OS', short_name: 'Daily OS', start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''),
        display: 'standalone', background_color: '#09090b', theme_color: '#09090b', icons: [{ src: png, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
      add('manifest', URL.createObjectURL(new Blob([JSON.stringify(m)], { type: 'application/manifest+json' })));
    }
  } catch (e) {}
})();
</script>
</body>
</html>
